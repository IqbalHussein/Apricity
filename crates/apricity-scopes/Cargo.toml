[package]
name = "apricity-scopes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Waveform, vectorscope, RGB parade, histogram and broadcast-legal checks (pure Rust CPU)."

[features]
# Emits TypeScript declarations for the public data types (used by apricity-ffi).
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
tsify-next = { version = "0.5", default-features = false, features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
apricity-core = { path = "../apricity-core" }
glam = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "scopes"
harness = false
