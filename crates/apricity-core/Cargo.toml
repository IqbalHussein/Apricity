[package]
name = "apricity-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Color science primitives, GradeParameters schema, and pure-Rust pipeline math for Apricity."

[features]
# Emits TypeScript declarations for the public data types (used by apricity-ffi).
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
tsify-next = { version = "0.5", default-features = false, features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
