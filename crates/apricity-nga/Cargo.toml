[package]
name = "apricity-nga"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Neural Grading Agent: deterministic on-device lexicon engine, prompt → GradeParameters, Explainability differ."

[features]
# Emits TypeScript declarations for the public data types (used by apricity-ffi).
tsify = ["dep:tsify-next", "dep:wasm-bindgen"]
default = []
# Reserved for the ADR-0003 ONNX model; nothing in this crate requires it.
onnx = ["dep:ort"]

[dependencies]
tsify-next = { version = "0.5", default-features = false, features = ["json"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
apricity-core = { path = "../apricity-core" }
ort = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
