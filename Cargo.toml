[workspace]
resolver = "2"
members = [
    "crates/apricity-core",
    "crates/apricity-render",
    "crates/apricity-scopes",
    "crates/apricity-lut",
    "crates/apricity-recipes",
    "crates/apricity-nga",
    "crates/apricity-io",
    "crates/apricity-ffi",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/iqbalabdishakur/apricity"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.27", features = ["serde"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }
image = { version = "0.25", default-features = false }
ort = { version = "2.0.0-rc.4", default-features = false }
proptest = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
