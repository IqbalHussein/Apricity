name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features apricity-render/golden-images -- -D warnings
      - run: cargo test --workspace

  golden-images:
    name: Golden-image tests (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - name: Run golden-image tests
        env:
          WGPU_BACKEND: vulkan
          APRICITY_REQUIRE_GPU: "1"
        run: cargo test -p apricity-render --features golden-images

  web:
    name: Web shell (build + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        # Pin to the version of `wasm-bindgen` declared by `apricity-ffi`.
        # Ahead of `pnpm build:wasm` so the post-cargo step finds the binary.
        run: cargo install wasm-bindgen-cli --version 0.2.120 --locked
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @apricity/web typecheck
      - run: pnpm --filter @apricity/web build
      - run: pnpm --filter @apricity/web test
