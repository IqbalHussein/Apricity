name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features apricity-render/golden-images -- -D warnings
      - run: cargo test --workspace

  golden-images:
    name: Golden-image tests (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true
      - name: Run golden-image tests
        env:
          WGPU_BACKEND: vulkan
          APRICITY_REQUIRE_GPU: "1"
        run: cargo test -p apricity-render --features golden-images

  web:
    name: Web shell (build + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p apricity-ffi --target wasm32-unknown-unknown --features wasm -- -D warnings
      - name: Install wasm-bindgen-cli
        # Pin to the version of `wasm-bindgen` declared by `apricity-ffi`.
        # Ahead of `pnpm build:wasm` so the post-cargo step finds the binary.
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @apricity/web typecheck
      - run: pnpm --filter @apricity/web lint
      - run: pnpm --filter @apricity/web build
      - run: pnpm --filter @apricity/web test

  e2e:
    name: Web shell (Playwright, CPU renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: shells/web
      - run: pnpm --filter @apricity/web build:wasm
      # Hosted runners have no GPU, so only the CPU-renderer project runs here.
      # The `webgpu` project runs locally, or later on a GPU runner.
      - name: Run Playwright
        run: pnpm --filter @apricity/web e2e --project=cpu-fallback
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            shells/web/playwright-report/
            shells/web/test-results/
          retention-days: 7
